name: Publish

# Publishes a version when it reaches main: a push that changes the version (in
# src/openroles/__init__.py and server.json) with no v<version> tag yet builds the package,
# publishes it to PyPI (trusted publishing, so no token is stored anywhere), then tags the
# commit and creates the GitHub release from the CHANGELOG entry, and lists the server in
# the MCP Registry. Nobody has to open a page, press a button or push a tag. A version
# already tagged is never published again, and one that disagrees between the package,
# server.json and the CHANGELOG publishes nothing and fails here, where it is seen.
on:
  push:
    branches: [main]
    paths: [src/openroles/__init__.py, server.json, CHANGELOG.md, .github/workflows/publish.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The version agrees everywhere, and is it new
        id: version
        run: |
          v=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/openroles/__init__.py').read()).group(1))")
          for other in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)"; do
            if [ "$other" != "$v" ]; then
              echo "the package says $v but server.json says $other: bump them to match" >&2
              exit 1
            fi
          done
          grep -q "^## $v (" CHANGELOG.md || { echo "CHANGELOG.md has no '## $v (' entry" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already published"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: pip install build && python -m build
      - if: steps.version.outputs.new == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A run that stopped after PyPI and before the release is run again in full.
          skip-existing: true

  # The tag and the GitHub release, made only once PyPI has the package, on the commit
  # that was published, with the CHANGELOG entry as its notes and the built files attached.
  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Notes from the changelog
        run: |
          python - "${{ needs.build.outputs.version }}" > notes.md <<'PY'
          import re, sys
          tag = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(tag) + r" \(.*?\)\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else f"openroles {tag}")
          PY
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          V: v${{ needs.build.outputs.version }}
        run: gh release create "$V" dist/* --target "$GITHUB_SHA" --title "$V" --notes-file notes.md

  # The official MCP Registry lists the server once PyPI has the release: it checks
  # the README on PyPI for the mcp-name line, so this runs after the upload. GitHub's
  # own login (OIDC) proves the io.github.aranculleton namespace; no secret.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        # PyPI can take a minute to show a new release, so a few tries, spaced out.
        run: |
          for i in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "not yet (try $i), waiting 30s"
            sleep 30
          done
          exit 1
