name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest ruff
      - run: ruff check .
      - run: pytest -q
      - name: The CLI and the MCP server start
        run: |
          openroles --version
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | openroles mcp | grep -q list_open_roles
